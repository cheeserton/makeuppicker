<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Makeup Look Builder 💄✨</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #ff007f;
      --primary-neon: #ff2a8d;
      --bg-dark: #0f020a;
      --yellow-highlight: #ffe600;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 255, 0.2) 0%, transparent 40%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem;
    }

    canvas:not(.wheel-canvas) {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      pointer-events: none !important;
      z-index: 9999 !important;
    }

    h1 {
      font-size: 2.2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px var(--primary-neon), 0 0 20px var(--primary);
      margin-bottom: 0.3rem;
      text-align: center;
    }

    .subtitle {
      color: #ff99dd;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .wheels-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 2.5rem;
      max-width: 900px;
      width: 100%;
    }

    .wheel-section {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .step-badge {
      background: rgba(255, 0, 127, 0.25);
      border: 1px solid var(--primary-neon);
      color: #ffb3e6;
      padding: 0.3rem 0.9rem;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
    }

    .wheel-wrapper {
      position: relative;
      width: 320px;
      height: 380px;
      touch-action: none;
    }

    .pointer-left, .pointer-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 0; 
      height: 0; 
      z-index: 20;
      pointer-events: none;
    }

    .pointer-left {
      left: -15px;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-left: 28px solid var(--yellow-highlight);
      filter: drop-shadow(0 0 8px #ffcc00);
    }

    .pointer-right {
      right: -15px;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-right: 28px solid var(--yellow-highlight);
      filter: drop-shadow(0 0 8px #ffcc00);
    }

    .wheel-canvas {
      width: 320px;
      height: 380px;
      border-radius: 16px;
      box-shadow: 0 0 35px var(--primary);
      cursor: grab;
    }

    .wheel-canvas:active {
      cursor: grabbing;
    }

    .spin-btn {
      margin-top: 1.2rem;
      background: linear-gradient(45deg, #ff007f, #ff00ff);
      color: #fff;
      border: 2px solid #fff;
      padding: 0.8rem 2rem;
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px var(--primary-neon);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .spin-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 30px var(--primary-neon);
    }

    .spin-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      filter: grayscale(80%);
    }

    /* Product Wheel Section Hidden Initially */
    #productSection {
      display: none;
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .results-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 500px;
      margin-top: 1.8rem;
    }

    .winner-box {
      background: rgba(255, 230, 0, 0.1);
      border: 2px dashed var(--yellow-highlight);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      display: none;
    }

    .winner-box h3 { 
      color: var(--yellow-highlight); 
      font-size: 1.3rem; 
      margin-bottom: 0.2rem; 
      text-transform: uppercase;
    }

    .sub-text {
      color: #ffb3e6;
      font-size: 0.85rem;
    }
    .sheet-status { max-width: 650px; text-align: center; margin-bottom: 1.5rem; font-size: .9rem; color: #ffb3e6; line-height: 1.6; }
    .sheet-reference { align-self: flex-start; margin-top: auto; padding-top: 2rem; font-size: .75rem; }
    .sheet-reference a { color: #b59aa9; text-decoration: none; }
    .sheet-reference a:hover, .sheet-reference a:focus-visible { color: #ffb3e6; text-decoration: underline; }
    .reset-btn { align-self: center; margin-top: 12px; padding: 10px 20px; min-height: 44px; border: 1px solid #b59aa9; border-radius: 22px; background: transparent; color: #ffb3e6; font-size: .9rem; cursor: pointer; }
    .reset-btn:hover:not(:disabled), .reset-btn:focus-visible { border-color: #ffb3e6; background: rgba(255, 0, 127, .12); }
    .reset-btn:disabled { opacity: .4; cursor: not-allowed; }
    #retryLoad { margin-left: 12px; padding: 6px 14px; cursor: pointer; }
  </style>
</head>
<body>

  <h1>Makeup Look Builder 💄✨</h1>
  <p class="subtitle">Spin the category wheel first, then spin for your exact product!</p>

  <div class="sheet-status">
    <p id="loadStatus" role="status" aria-live="polite">Loading your collection…</p>
    <button id="retryLoad" type="button" onclick="loadInventory()" hidden>Try again</button>
  </div>
  <div class="wheels-container">
    <!-- WHEEL 1: CATEGORY -->
    <div class="wheel-section" id="categorySection">
      <div class="step-badge">Step 1: Category</div>
      <div class="wheel-wrapper">
        <div class="pointer-left"></div>
        <div class="pointer-right"></div>
        <canvas id="categoryCanvas" class="wheel-canvas" width="320" height="380"></canvas>
      </div>
      <button class="spin-btn" id="catSpinBtn" disabled onclick="spinCategoryWheel()">Spin</button>
    </div>

    <!-- WHEEL 2: PRODUCT (Appears after Category is chosen) -->
    <div class="wheel-section" id="productSection">
      <div class="step-badge" id="productStepBadge">Step 2: Product</div>
      <div class="wheel-wrapper">
        <div class="pointer-left"></div>
        <div class="pointer-right"></div>
        <canvas id="productCanvas" class="wheel-canvas" width="320" height="380"></canvas>
      </div>
      <button class="spin-btn" id="prodSpinBtn" onclick="spinProductWheel()">Spin</button>
    </div>
  </div>

  <div class="results-wrapper">
    <div class="winner-box" id="categoryWinnerBox">
      <p class="sub-text">Selected Category:</p>
      <h3 id="categoryWinnerTitle">Category Name</h3>
    </div>

    <div class="winner-box" id="productWinnerBox">
      <p class="sub-text">Selected Product:</p>
      <h3 id="productWinnerTitle">Brand & Product Name</h3>
    </div>
  </div>

  <button type="button" class="reset-btn" id="resetBtn" onclick="resetLook()" hidden>Start over</button>

  <footer class="sheet-reference">
    <a href="https://docs.google.com/spreadsheets/d/10BKFl1hF1QAsp_Wso0PFr6pX-Eignnl4aqzHfr5bd2A/edit" target="_blank" rel="noopener noreferrer">Spreadsheet ↗</a>
  </footer>

<script>
  // Load the inventory once per page open. No polling or cached product list.
  const SHEET_ID = '10BKFl1hF1QAsp_Wso0PFr6pX-Eignnl4aqzHfr5bd2A';
  const INVENTORY_TABS = [
    'Lipsticks', 'Shadow Sticks', 'Eyeliners',
    'Liquid or Cream Eyeshadows', 'Single Shadows', 'Eyeshadow Palettes'
  ];
  let CATEGORIES = [];
  let PRODUCTS_BY_CATEGORY = {};
  let loading = false;
  let requestId = 0;

  function readInventoryTab(tabName) {
    // Google's supported response handler also works when opened as a local HTML file.
    return new Promise((resolve, reject) => {
      const callback = 'makeupSheetResponse' + (++requestId);
      const script = document.createElement('script');
      const timeout = setTimeout(() => finish(new Error('Google Sheets took too long to respond.')), 20000);
      function finish(error, data) {
        clearTimeout(timeout);
        script.remove();
        delete window[callback];
        if (error) reject(error); else resolve(data);
      }
      window[callback] = data => {
        if (data.status !== 'ok' || !data.table) {
          finish(new Error('Could not read the ' + tabName + ' tab.'));
          return;
        }
        try { finish(null, parseInventory(data.table, tabName)); }
        catch (error) { finish(error); }
      };
      script.onerror = () => finish(new Error('Could not connect to Google Sheets.'));
      const params = new URLSearchParams({
        sheet: tabName, headers: '0', range: 'A:G',
        tqx: 'out:json;responseHandler:' + callback,
        _ : String(Date.now())
      });
      script.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?' + params;
      document.head.appendChild(script);
    });
  }

  function parseInventory(table, tabName) {
    const rows = table.rows.map(row => row.c.map(cell => String(cell?.v ?? '').trim()));
    const headerIndex = rows.findIndex(row => row.includes('Brand') && row.includes('Name'));
    if (headerIndex < 0) throw new Error('Missing Brand or Name column in ' + tabName + '.');
    const header = rows[headerIndex];
    const brandIndex = header.indexOf('Brand');
    const nameIndex = header.indexOf('Name');
    const lineIndex = header.indexOf('Line');
    const colorIndex = header.indexOf('Color Family');
    const seen = new Set();
    return rows.slice(headerIndex + 1).filter(row =>
      row[brandIndex] && row[nameIndex] && row[brandIndex] !== 'Brand'
    ).map(row => {
      const parts = [row[brandIndex], lineIndex >= 0 ? row[lineIndex] : '', row[nameIndex]].filter(Boolean);
      return { label: parts.join(' — '), parts, colorFamily: colorIndex >= 0 ? row[colorIndex] || '' : '' };
    }).filter(product => {
      if (seen.has(product.label)) return false;
      seen.add(product.label);
      return true;
    });
  }

  async function loadInventory() {
    if (loading) return;
    loading = true;
    const status = document.getElementById('loadStatus');
    status.parentElement.hidden = false;
    document.getElementById('retryLoad').hidden = true;
    status.textContent = 'Loading your collection from Google Sheets…';
    try {
      const lists = await Promise.all(INVENTORY_TABS.map(readInventoryTab));
      const entries = INVENTORY_TABS.map((name, i) => [name, lists[i]]).filter(([, list]) => list.length);
      if (!entries.length) throw new Error('No products found in the inventory tabs.');
      PRODUCTS_BY_CATEGORY = Object.fromEntries(entries);
      CATEGORIES = entries.map(([name]) => name);
      drawCategoryWheel();
      document.getElementById('catSpinBtn').disabled = false;
      status.textContent = '';
      status.parentElement.hidden = true;
    } catch (error) {
      status.textContent = 'Unable to load your collection. ' + error.message + ' Check your connection and that the sheet is still accessible.';
      document.getElementById('retryLoad').hidden = false;
    } finally { loading = false; }
  }

  const sliceColors = [
    '#ff0055', '#7b2cbf', '#ff9e00', '#00b4d8', 
    '#38b000', '#e01e37', '#9d4edd'
  ];

  const familyColors = {
    red: '#a84d58', brown: '#896451', nude: '#d2b29d', pink: '#d695b1',
    purple: '#9171a9', black: '#34313c', blue: '#668fb5', green: '#789579',
    orange: '#ce9368', yellow: '#d5bd77', gold: '#bca064', silver: '#b3b8c2',
    white: '#e7e0da', beige: '#d5c3a7', rose: '#b9768b', peach: '#deb09b',
    coral: '#cd897b', burgundy: '#774452', plum: '#81516f', mauve: '#ad899e',
    taupe: '#a99b90', grey: '#98989f', gray: '#98989f', teal: '#608e91'
  };

  function productPalette(product) {
    const firstFamily = product.colorFamily.split(',')[0].trim().toLowerCase();
    const background = familyColors[firstFamily] || '#85808e';
    const channels = background.slice(1).match(/../g).map(hex => {
      const value = parseInt(hex, 16) / 255;
      return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
    });
    const luminance = channels[0] * .2126 + channels[1] * .7152 + channels[2] * .0722;
    return { background, text: luminance > .179 ? '#111111' : '#ffffff' };
  }

  function wrapLabel(ctx, text, maxWidth) {
    const lines = [];
    let line = '';
    for (const word of text.split(/\s+/)) {
      const candidate = line ? line + ' ' + word : word;
      if (ctx.measureText(candidate).width <= maxWidth) { line = candidate; continue; }
      if (line) lines.push(line);
      line = '';
      for (const char of word) {
        if (line && ctx.measureText(line + char).width > maxWidth) { lines.push(line); line = ''; }
        line += char;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  // Category Wheel State
  let catPos = 0;
  let isCatSpinning = false;
  let winningCatIndex = 0;
  let selectedCategory = '';

  // Product Wheel State
  let prodPos = 0;
  let isProdSpinning = false;
  let winningProdIndex = 0;
  let currentProductList = [];

  // Drag variables for Category Wheel
  let catDragging = false;
  let catStartY = 0;
  let catDragStartPos = 0;

  // Drag variables for Product Wheel
  let prodDragging = false;
  let prodStartY = 0;
  let prodDragStartPos = 0;

  const catCanvas = document.getElementById('categoryCanvas');
  const prodCanvas = document.getElementById('productCanvas');

  // Generic render function for 3D Big Wheel
  function drawBigWheel(canvasObj, items, currentPos) {
    const ctx = canvasObj.getContext('2d');
    const width = canvasObj.width;
    const height = canvasObj.height;
    const centerY = height / 2;
    // Repeat small lists to keep the drum drawable, and show a moving window for large inventories.
    // Selection uses the full list, so every product keeps an equal chance.
    const originalCount = items.length;
    if (originalCount > 0) {
      const visibleCount = 9;
      const step = 2 * Math.PI / originalCount;
      const center = Math.round(-currentPos / step);
      const fraction = currentPos / step + center;
      items = Array.from({length: visibleCount}, (_, i) => items[((center + i - 4) % originalCount + originalCount) % originalCount]);
      currentPos = (fraction - 4) * (2 * Math.PI / visibleCount);
    }
    const numSlices = items.length;
    const sliceAngle = (2 * Math.PI) / numSlices;

    ctx.clearRect(0, 0, width, height);

    ctx.fillStyle = '#0a0107';
    ctx.fillRect(0, 0, width, height);

    const railGradient = ctx.createLinearGradient(0, 0, width, 0);
    railGradient.addColorStop(0, '#ff007f');
    railGradient.addColorStop(0.08, '#33001a');
    railGradient.addColorStop(0.12, '#110109');
    railGradient.addColorStop(0.88, '#110109');
    railGradient.addColorStop(0.92, '#33001a');
    railGradient.addColorStop(1, '#ff007f');
    ctx.fillStyle = railGradient;
    ctx.fillRect(0, 0, width, height);

    const drumLeft = 35;
    const drumWidth = width - 70;
    const radius = 160;

    for (let i = 0; i < numSlices; i++) {
      let angle = currentPos + (i * sliceAngle);
      angle = Math.atan2(Math.sin(angle), Math.cos(angle));

      if (angle > -Math.PI / 1.8 && angle < Math.PI / 1.8) {
        const yTop = centerY + Math.sin(angle - sliceAngle / 2) * radius;
        const yBottom = centerY + Math.sin(angle + sliceAngle / 2) * radius;
        const sliceHeight = yBottom - yTop;

        if (sliceHeight > 1) {
          const depth = Math.cos(angle);
          
          ctx.save();
          const product = typeof items[i] === 'object' ? items[i] : null;
          const palette = product ? productPalette(product) : null;
          ctx.fillStyle = palette ? palette.background : sliceColors[i % sliceColors.length];
          ctx.fillRect(drumLeft, yTop, drumWidth, sliceHeight);

          const shadowGrad = ctx.createLinearGradient(0, yTop, 0, yBottom);
          shadowGrad.addColorStop(0, 'rgba(0,0,0,0.6)');
          shadowGrad.addColorStop(0.3, 'rgba(0,0,0,0)');
          shadowGrad.addColorStop(0.7, 'rgba(0,0,0,0)');
          shadowGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
          ctx.fillStyle = shadowGrad;
          ctx.fillRect(drumLeft, yTop, drumWidth, sliceHeight);

          ctx.fillStyle = '#ffe600';
          ctx.fillRect(drumLeft, yTop, drumWidth, 3);

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(drumLeft - 8, yTop + sliceHeight / 2, 4 * depth + 1, 0, Math.PI * 2);
          ctx.arc(drumLeft + drumWidth + 8, yTop + sliceHeight / 2, 4 * depth + 1, 0, Math.PI * 2);
          ctx.fill();

          if (depth > 0.2) {
            ctx.beginPath();
            ctx.rect(drumLeft + 5, yTop + 4, drumWidth - 10, sliceHeight - 8);
            ctx.clip();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = palette ? palette.text : '#ffffff';
            const parts = product ? product.parts : [items[i]];
            let fontSize = product ? 14 : 16;
            let lines;
            do {
              ctx.font = `700 ${fontSize}px sans-serif`;
              lines = parts.flatMap(part => wrapLabel(ctx, part, drumWidth - 24));
              if (lines.length * fontSize * 1.15 <= 76 || fontSize <= 11) break;
              fontSize--;
            } while (true);
            // Wrap at normal letter proportions; only the drum perspective compresses height.
            const lineHeight = fontSize * 1.15;
            ctx.translate(width / 2, (yTop + yBottom) / 2);
            ctx.scale(1, Math.max(.2, depth));
            lines.forEach((line, index) => ctx.fillText(line, 0, (index - (lines.length - 1) / 2) * lineHeight));
          }

          ctx.restore();
        }
      }
    }

    ctx.strokeStyle = 'rgba(255, 230, 0, 0.8)';
    ctx.lineWidth = 3;
    ctx.strokeRect(drumLeft - 2, centerY - 46, drumWidth + 4, 92);
  }

  function drawCategoryWheel() {
    drawBigWheel(catCanvas, CATEGORIES, catPos);
  }

  function drawProductWheel() {
    if (currentProductList.length > 0) {
      drawBigWheel(prodCanvas, currentProductList, prodPos);
    }
  }

  /* --- Category Wheel Drag Handling --- */
  catCanvas.addEventListener('mousedown', (e) => startCatDrag(e.clientY));
  window.addEventListener('mousemove', (e) => moveCatDrag(e.clientY));
  window.addEventListener('mouseup', endCatDrag);

  catCanvas.addEventListener('touchstart', (e) => startCatDrag(e.touches[0].clientY));
  window.addEventListener('touchmove', (e) => moveCatDrag(e.touches[0].clientY));
  window.addEventListener('touchend', endCatDrag);

  function startCatDrag(y) {
    if (isCatSpinning || isProdSpinning || !CATEGORIES.length) return;
    catDragging = true;
    catStartY = y;
    catDragStartPos = catPos;
  }

  function moveCatDrag(y) {
    if (!catDragging) return;
    const deltaY = y - catStartY;
    catPos = catDragStartPos + (deltaY * 0.015);
    drawCategoryWheel();
  }

  function endCatDrag() {
    if (!catDragging) return;
    catDragging = false;
    snapCatToNearest();
  }

  function snapCatToNearest() {
    const numSlices = CATEGORIES.length;
    const sliceAngle = (2 * Math.PI) / numSlices;
    const rawIndex = Math.round(((-catPos % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI) / sliceAngle) % numSlices;
    winningCatIndex = rawIndex;

    const currentRotations = Math.floor(catPos / (2 * Math.PI));
    const targetBaseAngle = (numSlices - winningCatIndex) * sliceAngle;
    const targetPos = currentRotations * (2 * Math.PI) + targetBaseAngle;

    animateCatToPosition(targetPos, 400);
  }

  function spinCategoryWheel() {
    if (isCatSpinning || isProdSpinning || !CATEGORIES.length) return;

    document.getElementById('categoryWinnerBox').style.display = 'none';
    document.getElementById('productWinnerBox').style.display = 'none';

    const numSlices = CATEGORIES.length;
    const sliceAngle = (2 * Math.PI) / numSlices;

    winningCatIndex = Math.floor(Math.random() * numSlices);

    const targetBaseAngle = (numSlices - winningCatIndex) * sliceAngle;
    const extraRounds = (5 + Math.floor(Math.random() * 4)) * (2 * Math.PI);
    const currentRotations = Math.floor(catPos / (2 * Math.PI));
    const targetPos = (currentRotations + 1) * (2 * Math.PI) + targetBaseAngle + extraRounds;

    animateCatToPosition(targetPos, 4000);
  }

  function animateCatToPosition(targetPos, duration) {
    catDragging = false;
    prodDragging = false;
    isCatSpinning = true;
    document.getElementById('resetBtn').disabled = true;
    document.getElementById('productSection').style.display = 'none';
    document.getElementById('productWinnerBox').style.display = 'none';
    document.getElementById('catSpinBtn').disabled = true;

    const start = performance.now();
    const initialPos = catPos;

    function animate(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);

      catPos = initialPos + (ease * (targetPos - initialPos));
      drawCategoryWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        catPos = targetPos;
        drawCategoryWheel();
        isCatSpinning = false;
        document.getElementById('catSpinBtn').disabled = false;
        onCategorySelected();
      }
    }

    requestAnimationFrame(animate);
  }

  function resetLook() {
    if (isCatSpinning || isProdSpinning) return;
    catDragging = false;
    prodDragging = false;
    catPos = 0;
    prodPos = 0;
    winningCatIndex = 0;
    winningProdIndex = 0;
    selectedCategory = '';
    currentProductList = [];
    document.getElementById('categoryWinnerBox').style.display = 'none';
    document.getElementById('productWinnerBox').style.display = 'none';
    document.getElementById('categoryWinnerTitle').textContent = '';
    document.getElementById('productWinnerTitle').textContent = '';
    document.getElementById('productSection').style.display = 'none';
    document.getElementById('productStepBadge').textContent = 'Step 2: Product';
    document.getElementById('resetBtn').hidden = true;
    prodCanvas.getContext('2d').clearRect(0, 0, prodCanvas.width, prodCanvas.height);
    drawCategoryWheel();
    document.getElementById('catSpinBtn').focus();
    document.getElementById('categorySection').scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }

  function onCategorySelected() {
    document.getElementById('resetBtn').hidden = false;
    document.getElementById('resetBtn').disabled = false;
    selectedCategory = CATEGORIES[winningCatIndex];
    document.getElementById('categoryWinnerTitle').textContent = selectedCategory;
    document.getElementById('categoryWinnerBox').style.display = 'block';

    // Populate Product Wheel items for this category
    currentProductList = PRODUCTS_BY_CATEGORY[selectedCategory] || [];
    prodPos = 0;

    // Show Product Wheel Section
    const prodSection = document.getElementById('productSection');
    document.getElementById('productStepBadge').textContent = `Step 2: ${selectedCategory} Product`;
    prodSection.style.display = 'flex';

    drawProductWheel();
    if (typeof confetti === 'function') confetti({ particleCount: 40, spread: 50, origin: { y: 0.6 } });
  }

  /* --- Product Wheel Drag Handling --- */
  prodCanvas.addEventListener('mousedown', (e) => startProdDrag(e.clientY));
  window.addEventListener('mousemove', (e) => moveProdDrag(e.clientY));
  window.addEventListener('mouseup', endProdDrag);

  prodCanvas.addEventListener('touchstart', (e) => startProdDrag(e.touches[0].clientY));
  window.addEventListener('touchmove', (e) => moveProdDrag(e.touches[0].clientY));
  window.addEventListener('touchend', endProdDrag);

  function startProdDrag(y) {
    if (isProdSpinning || isCatSpinning || !currentProductList.length) return;
    prodDragging = true;
    prodStartY = y;
    prodDragStartPos = prodPos;
  }

  function moveProdDrag(y) {
    if (!prodDragging) return;
    const deltaY = y - prodStartY;
    prodPos = prodDragStartPos + (deltaY * 0.015);
    drawProductWheel();
  }

  function endProdDrag() {
    if (!prodDragging) return;
    prodDragging = false;
    snapProdToNearest();
  }

  function snapProdToNearest() {
    const numSlices = currentProductList.length;
    const sliceAngle = (2 * Math.PI) / numSlices;
    const rawIndex = Math.round(((-prodPos % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI) / sliceAngle) % numSlices;
    winningProdIndex = rawIndex;

    const currentRotations = Math.floor(prodPos / (2 * Math.PI));
    const targetBaseAngle = (numSlices - winningProdIndex) * sliceAngle;
    const targetPos = currentRotations * (2 * Math.PI) + targetBaseAngle;

    animateProdToPosition(targetPos, 400);
  }

  function spinProductWheel() {
    if (isProdSpinning || isCatSpinning || currentProductList.length === 0) return;

    document.getElementById('productWinnerBox').style.display = 'none';

    const numSlices = currentProductList.length;
    const sliceAngle = (2 * Math.PI) / numSlices;

    winningProdIndex = Math.floor(Math.random() * numSlices);

    const targetBaseAngle = (numSlices - winningProdIndex) * sliceAngle;
    const extraRounds = (5 + Math.floor(Math.random() * 4)) * (2 * Math.PI);
    const currentRotations = Math.floor(prodPos / (2 * Math.PI));
    const targetPos = (currentRotations + 1) * (2 * Math.PI) + targetBaseAngle + extraRounds;

    animateProdToPosition(targetPos, 4000);
  }

  function animateProdToPosition(targetPos, duration) {
    prodDragging = false;
    isProdSpinning = true;
    document.getElementById('resetBtn').disabled = true;
    document.getElementById('prodSpinBtn').disabled = true;

    const start = performance.now();
    const initialPos = prodPos;

    function animate(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);

      prodPos = initialPos + (ease * (targetPos - initialPos));
      drawProductWheel();

      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        prodPos = targetPos;
        drawProductWheel();
        isProdSpinning = false;
        document.getElementById('prodSpinBtn').disabled = false;
        onProductSelected();
      }
    }

    requestAnimationFrame(animate);
  }

  function onProductSelected() {
    document.getElementById('resetBtn').disabled = false;
    const winnerProduct = currentProductList[winningProdIndex];
    document.getElementById('productWinnerTitle').textContent = winnerProduct.label;
    document.getElementById('productWinnerBox').style.display = 'block';

    if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
  }

  drawCategoryWheel();
  loadInventory();
</script>
</body>
</html>
